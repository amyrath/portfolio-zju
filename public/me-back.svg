    <rect x="-24" y="10" width="48" height="60" rx="10" fill="#FFC9A9" />
    <circle cx="0" cy="-20" r="65" fill="#FFC9A9" />
    <path d="M-68,-25 C-65,-85 65,-85 68,-25 C50,-60 -50,-60 -68,-25 Z" fill="#470E0B" />
