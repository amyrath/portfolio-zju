      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#FF8B71" />
      <stop offset="100%" stop-color="#FFFDB6" />
    </linearGradient>
    <filter id="shadowBack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#470E0B" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <rect width="400" height="500" fill="url(#warmBgBack)" />
  
  <circle cx="310" cy="90" r="50" fill="#FFFDE8" opacity="0.6" />
  <circle cx="80" cy="140" r="40" fill="#A7F3D0" opacity="0.8" />
  <circle cx="320" cy="390" r="60" fill="#FF8B71" opacity="0.7" />
  
  <g transform="translate(200, 260)" filter="url(#shadowBack)">
