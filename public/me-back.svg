  <rect x="70" y="420" width="260" height="42" rx="21" fill="#FFFFFF" stroke="#470E0B" stroke-width="2" />
  <text x="200" y="446" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#470E0B" text-anchor="middle">
